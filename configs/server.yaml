# 服务器配置：只写与 base.yaml 的差异。
# 用法：python -m rag_core.cli --config configs/server.yaml build
extends: base.yaml

name: server

embedding:
  model: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  dim: 1024

store:
  collection: recipe_chunks_m3

llm:
  # 魔搭 OpenAI 兼容端点；D1 探针冻结的主模型，可用 .env 覆盖
  model: ${LLM_MODEL:-deepseek-ai/DeepSeek-V4.1-Flash-1017}
  base_url: ${LLM_BASE_URL:-https://api-inference.modelscope.cn/v1}
